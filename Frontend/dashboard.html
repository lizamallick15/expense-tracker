<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Dashboard</title>

    <style>
        body {
            background: #f4f4f4;
            font-family: Arial;
            padding: 0;
            margin: 0;
        }

        .container {
            width: 450px;
            background: #fff;
            margin: 40px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #43a047;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table th, table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        canvas {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Monthly Expense Tracker</h2>

    <input type="text" id="expName" placeholder="Expense Name">
    <input type="number" id="expAmount" placeholder="Amount">
    <button onclick="addExpense()">Add Expense</button>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Amount (₹)</th>
            </tr>
        </thead>
        <tbody id="expTable"></tbody>
    </table>

    <canvas id="expenseChart" height="200"></canvas>
</div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    let labels = [];
    let dataValues = [];

    // Chart Configuration
    const ctx = document.getElementById("expenseChart").getContext("2d");
    const expenseChart = new Chart(ctx, {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "Expenses (₹)",
                data: dataValues,
                backgroundColor: "rgba(75, 192, 192, 0.6)"
            }]
        }
    });

    // Add Expense Function
    function addExpense() {
        let name = document.getElementById("expName").value;
        let amount = document.getElementById("expAmount").value;

        if (name === "" || amount === "") {
            alert("Please enter name & amount!");
            return;
        }

        // Add to table
        let table = document.getElementById("expTable");
        let row = <tr><td>${name}</td><td>₹${amount}</td></tr>;
        table.innerHTML += row;

        // Add to graph
        labels.push(name);
        dataValues.push(amount);

        expenseChart.update();

        // Clear input fields
        document.getElementById("expName").value = "";
        document.getElementById("expAmount").value = "";
    }
</script>

</body>
</html>
